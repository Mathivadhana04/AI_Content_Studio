server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-content-studio

  # ===== Database =====
  datasource:
    url: jdbc:mysql://localhost:3306/ai_content_studio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: Solitude04@12
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: false

  # ===== Jackson =====
  jackson:
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false
    time-zone: UTC

  # ===== File Upload =====
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ===== JWT Configuration =====
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: 86400000     # 24 hours in ms
    refresh-token-expiration: 604800000   # 7 days in ms

  # ===== CORS =====
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  # ===== AI Provider =====
  # Set to 'groq' or 'ollama'
  ai:
    provider: ${AI_PROVIDER:groq}

  # ===== Groq API (Primary — free Llama models) =====
  groq:
    api-key: ${GROQ_API_KEY:YOUR_GROQ_API_KEY_HERE}
    base-url: https://api.groq.com/openai/v1
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    max-tokens: 4096
    temperature: 0.7

  # ===== Ollama (Local fallback) =====
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3}
    max-tokens: 4096
    temperature: 0.7

  # ===== AI Rate Limiting (per user, per day) =====
  rate-limit:
    ai-requests-per-day: ${AI_RATE_LIMIT:50}

# ===== SpringDoc / Swagger =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: AI Content Studio API
    version: 1.0.0
    description: Enterprise AI-Powered Content Generation SaaS Platform

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ===== Logging =====
logging:
  level:
    com.aicontentstudio: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
